name: ikentic-governance-gates

on:
  pull_request:
    branches:
      - integration/ikentic
  push:
    branches:
      - integration/ikentic

jobs:
  governance-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Fetch refs for governance checks
        run: |
          set -euo pipefail
          git fetch origin --prune \
            +refs/heads/integration/ikentic:refs/remotes/origin/integration/ikentic \
            +refs/heads/topic/source-packets/*:refs/remotes/origin/topic/source-packets/*

      - name: Run packet-stack audits
        id: audits
        run: |
          set -euo pipefail
          mkdir -p .ikentic/reports

          packet_status=0
          latest_packet_ref="$(git for-each-ref --sort=refname --format='%(refname:short)' refs/remotes/origin/topic/source-packets | tail -n 1)"
          if [[ -z "$latest_packet_ref" ]]; then
            echo "No topic/source-packets refs found." > .ikentic/reports/packet-stack.txt
            packet_status=1
          elif git merge-base --is-ancestor "$latest_packet_ref" refs/remotes/origin/integration/ikentic; then
            {
              echo "Integration Ref: refs/remotes/origin/integration/ikentic"
              echo "Latest Packet Source: ${latest_packet_ref}"
              echo "PASS ${latest_packet_ref}"
            } > .ikentic/reports/packet-stack.txt
          else
            {
              echo "Integration Ref: refs/remotes/origin/integration/ikentic"
              echo "Latest Packet Source: ${latest_packet_ref}"
              echo "FAIL ${latest_packet_ref}"
            } > .ikentic/reports/packet-stack.txt
            packet_status=1
          fi

          echo "packet_status=${packet_status}" | tee .ikentic/reports/governance-status.txt

          echo "packet_status=${packet_status}" >> "$GITHUB_OUTPUT"

      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikentic-governance-reports-${{ github.run_id }}
          path: .ikentic/reports
          if-no-files-found: error
          retention-days: 14

      - name: Enforce blocking governance gates
        run: |
          set -euo pipefail

          packet='${{ steps.audits.outputs.packet_status }}'

          if [[ "$packet" != "0" ]]; then
            echo "FAIL: integration/ikentic does not contain the latest source packet ref"
            exit 1
          fi

          echo "PASS: blocking governance gates satisfied"
