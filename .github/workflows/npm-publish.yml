name: NPM Publish

on:
  push:
    tags:
      - "v*-ike*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Enforce version branch release lineage
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_SHA="${GITHUB_SHA}"
          VERSION_REF="version/openclaw-${TAG_VERSION}"
          git fetch --no-tags origin \
            "+refs/heads/${VERSION_REF}:refs/remotes/origin/${VERSION_REF}" \
            +refs/heads/integration/ikentic:refs/remotes/origin/integration/ikentic
          VERSION_SHA="$(git rev-parse "origin/${VERSION_REF}")"
          INTEGRATION_SHA="$(git rev-parse origin/integration/ikentic)"
          echo "Lineage check context: tag=${GITHUB_REF_NAME} tag_sha=${TAG_SHA}"
          echo "Lineage check refs: origin/${VERSION_REF}=${VERSION_SHA} origin/integration/ikentic=${INTEGRATION_SHA}"
          if [ "$TAG_SHA" != "$VERSION_SHA" ]; then
            echo "Lineage check failed: tag commit ${TAG_SHA} does not equal origin/${VERSION_REF} (${VERSION_SHA})."
            exit 1
          fi
          echo "Lineage check passed: tag commit equals origin/${VERSION_REF}."
          if [ "$TAG_SHA" = "$INTEGRATION_SHA" ]; then
            echo "Lineage check passed: version branch is the current integration head."
          else
            echo "Lineage check note: version branch is a historical release head, not the current integration head."
          fi

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Validate semver tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if ! [[ "$PACKAGE_VERSION" =~ $SEMVER_REGEX ]]; then
            echo "package.json version is not valid semver: $PACKAGE_VERSION"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Release check
        run: pnpm release:check

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@locusai"

      - name: Resolve publish dist-tag
        id: resolve-publish-tag
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${TAG_VERSION%%-*}"
          BASE_DIST_TAG="ike-${BASE_VERSION//./-}"
          PRERELEASE="$(printf '%s' "$TAG_VERSION" | sed -nE 's/^[0-9]+\.[0-9]+\.[0-9]+-([^+]+)(\+.*)?$/\1/p')"
          if [ -z "$PRERELEASE" ]; then
            echo "dist_tag=" >> "$GITHUB_OUTPUT"
            echo "base_dist_tag=" >> "$GITHUB_OUTPUT"
            echo "No prerelease suffix detected; publishing with npm default tag."
            exit 0
          fi
          if [[ "$TAG_VERSION" =~ -ike\.beta\. ]]; then
            DIST_TAG="beta"
          elif [[ "$TAG_VERSION" =~ -ike\.rc\. ]]; then
            DIST_TAG="rc"
          elif [[ "$TAG_VERSION" =~ -ike\.dev\. ]]; then
            DIST_TAG="dev"
          else
            DIST_TAG="${PRERELEASE%%.*}"
          fi
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "base_dist_tag=$BASE_DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Using npm dist-tag: $DIST_TAG"
          echo "Using npm stable-base dist-tag: $BASE_DIST_TAG"

      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          OWNER_SCOPE="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          export TARGET_NAME="@${OWNER_SCOPE}/openclaw"
          node --input-type=module -e '
            import fs from "node:fs";
            const target = process.env.TARGET_NAME;
            const path = "package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            if (pkg.name !== target) {
              pkg.name = target;
              fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
              console.log(`Publish override: package name set to ${target}`);
            } else {
              console.log(`Publish override: package name already ${target}`);
            }
          '
          if [ -n "${NPM_PUBLISH_DIST_TAG:-}" ]; then
            npm publish --tag "$NPM_PUBLISH_DIST_TAG" --registry "https://npm.pkg.github.com"
          else
            npm publish --registry "https://npm.pkg.github.com"
          fi
          if [ -n "${NPM_BASE_DIST_TAG:-}" ]; then
            npm dist-tag add "${TARGET_NAME}@${TAG_VERSION}" "$NPM_BASE_DIST_TAG" --registry "https://npm.pkg.github.com"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_PUBLISH_DIST_TAG: ${{ steps.resolve-publish-tag.outputs.dist_tag }}
          NPM_BASE_DIST_TAG: ${{ steps.resolve-publish-tag.outputs.base_dist_tag }}
          TARGET_NAME: "@${{ github.repository_owner }}/openclaw"
