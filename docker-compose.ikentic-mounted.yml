# Ikentic overlay: host-mounted state + workspace, plugin mounted from host.
services:
  openclaw-gateway:
    env_file:
      - .env
    environment:
      HOME: /home/openclaw
      OPENCLAW_STATE_DIR: /home/openclaw/.openclaw
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/openclaw/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/openclaw/clawd
      - ${IKENTIC_PLUGIN_DIR}:/home/openclaw/.openclaw-plugins/ikentic
    entrypoint:
      - /bin/sh
      - -lc
    command: /usr/local/bin/start-openclaw.sh

  openclaw-cli:
    env_file:
      - .env
    environment:
      HOME: /home/openclaw
      OPENCLAW_STATE_DIR: /home/openclaw/.openclaw
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/openclaw/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/openclaw/clawd
      - ${IKENTIC_PLUGIN_DIR}:/home/openclaw/.openclaw-plugins/ikentic
    entrypoint:
      - /bin/sh
      - -lc
      - exec runuser -u openclaw -- env HOME='/home/openclaw' OPENCLAW_STATE_DIR='/home/openclaw/.openclaw' PATH='/home/openclaw/.openclaw/bin:/opt/openclaw-runtime/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' sh -lc 'exec openclaw "$@"' -- "$@"
      - --
